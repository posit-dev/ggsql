[package]
name = "ggsql-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Command-line interface for ggsql"
build = "build.rs"

[[bin]]
name = "ggsql"
path = "src/main.rs"

# Visual test harness: renders every `{ggsql}` cell in the docs into an HTML
# report. Gated so a plain workspace build never pulls in the GPU stack.
[[example]]
name = "visual_test"
path = "examples/visual_test.rs"
required-features = ["png", "duckdb", "vegalite", "builtin-data"]

[dev-dependencies]
# Decoding renders back to pixels, so `visual_test --baseline` can compare
# pictures rather than files. Dev-only: nothing in the shipped binary reads a
# PNG. Same major as the encoder hephaestus uses, so no second copy is built.
png = "0.18"

[dependencies]
ggsql = { workspace = true }

# CLI and error handling
clap.workspace = true
anyhow.workspace = true

# Serialization (used by `parse --format json`)
serde_json.workspace = true

# Regex (used by `docs` markdown post-processing)
regex.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Terminal markdown rendering for `ggsql docs` (native targets only;
# crossterm 0.29 doesn't compile on wasm32)
termimad = "0.31"

[build-dependencies]
regex.workspace = true
ureq = "3"

[features]
default = ["duckdb", "sqlite", "vegalite", "parquet", "builtin-data", "odbc", "svg", "pdf", "hep"]
duckdb = ["ggsql/duckdb"]
parquet = ["ggsql/parquet"]
sqlite = ["ggsql/sqlite"]
odbc = ["ggsql/odbc"]
# Internal, and enabled by each writer feature rather than named directly: on
# when at least one writer is compiled in. It lets the code that exists only to
# serve a writer be gated on one name instead of an `any(...)` list that has to
# grow with every format.
any-writer = []

vegalite = ["ggsql/vegalite", "any-writer"]
png = ["ggsql/png", "any-writer"]
jpeg = ["ggsql/jpeg", "any-writer"]
tiff = ["ggsql/tiff", "any-writer"]
webp = ["ggsql/webp", "any-writer"]
svg = ["ggsql/svg", "any-writer"]
pdf = ["ggsql/pdf", "any-writer"]
hep = ["ggsql/hep", "any-writer"]

# The plot viewer. Not a writer, so deliberately not in `all-writers`: it
# blocks, it is native-only, and it produces no output.
window = ["ggsql/window"]
builtin-data = ["ggsql/builtin-data"]
all-readers = ["duckdb", "sqlite", "odbc"]
all-writers = ["vegalite", "png", "jpeg", "tiff", "webp", "svg", "pdf", "hep"]

# cargo-packager configuration for cross-platform installers
[package.metadata.packager]
product-name = "ggsql"
identifier = "com.ggsql.app"
category = "DeveloperTool"
publisher = "ggsql Team"
authors = ["ggsql Team"]
icons = ["../doc/assets/logo.png"]
license-file = "../LICENSE.md"
out-dir = "target/release/packager"
homepage = "https://ggsql.org/"
description = "SQL extension for declarative data visualization"
long-description = "ggsql extends SQL with a VISUALISE clause for declarative data visualization based on Grammar of Graphics principles. Combine SQL queries with visualization specifications to create charts directly from your data."
copyright = "Copyright (c) 2026 ggsql Team"

# Binaries to include in the package
binaries = [
  { path = "ggsql", main = true },
  { path = "ggsql-jupyter", main = false },
]

# The default `svg`/`pdf`/`hep` writers lay text out through fontconfig, loaded
# at run time (see /CLAUDE.md). Nothing is needed to *build* against it, but
# without the runtime library and a font a plot renders with no labels at all
# and no error, so the package declares both rather than degrading silently.
[package.metadata.packager.deb]
depends = ["libfontconfig1", "fonts-dejavu-core"]

