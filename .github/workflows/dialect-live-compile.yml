name: dialect-live compile (reusable)

# Shared compile job for the dialect-live workflows: builds the
# dialect_live test binary once and hands it to every backend leg as an
# artifact, so the legs compile nothing. Callers:
# - dialect-live.yml (PRs + main): passes save-cache on main only.
# - dialect-live-cloud.yml (nightly): never saves — a scheduled run must
#   not fight over the shared cache key owned by build.yaml/main.

on:
  workflow_call:
    inputs:
      save-cache:
        description: Whether to save the rust-cache back under the shared key.
        type: boolean
        default: false

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install tree-sitter-cli
        # parser.c is gitignored and generated from grammar.js by the
        # tree-sitter-ggsql build script on every fresh checkout.
        run: npm install -g tree-sitter-cli

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Caching
        uses: Swatinem/rust-cache@v2
        with:
          # Deliberately the same shared-key as build.yaml: rust-cache's
          # prefix fallback restores the build job's target/, so this job
          # only rebuilds the feature deltas instead of every dependency,
          # and on main it saves the warmed variant back for build.yaml
          # and PR runs to reuse.
          shared-key: ${{ runner.os }}-build
          cache-on-failure: true
          save-if: ${{ inputs.save-cache }}

      - name: Compile the dialect_live test binary
        # --no-run plus --message-format=json yields the binary path; the
        # binary is self-contained (deps statically linked, ODBC/ADBC
        # drivers dlopened at runtime), so the legs can run it directly.
        # Feature set is load-bearing: `adbc` compiles in the ADBC reader
        # path and `sqlite` provides the cache backend Druid wraps in. The
        # datafusion leg uses the Foundry driver through the driver manager,
        # so the DataFusion graph never enters the test build.
        run: |
          bin=$(cargo test -p ggsql --features "adbc sqlite" --test dialect_live \
                --no-run --message-format=json-render-diagnostics \
                | jq -rs '[.[] | select(.target.name == "dialect_live" and .executable != null) | .executable][-1]')
          test -n "$bin" -a -f "$bin"
          cp "$bin" dialect-live-bin

      - name: Upload the test binary
        uses: actions/upload-artifact@v4
        with:
          name: dialect-live-bin
          path: dialect-live-bin
          retention-days: 1
