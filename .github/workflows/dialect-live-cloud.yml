name: Nightly Cloud Dialect Tests

# Tier 3 dialect conformance: the same battery as dialect-live.yml (see
# src/tests/battery/mod.rs and src/tests/dialect_live.rs) against
# proprietary cloud backends that need credentials — snowflake, bigquery,
# databricks. Runs nightly and on demand, never on PRs: cost and flake
# stay off the PR path.
#
# Each leg's connection URI comes from a repository secret named exactly
# like the harness env var (GGSQL_TEST_URI_<BACKEND>); when the secret is
# unset (forks, fresh checkouts before secrets are configured) the test
# prints a skip note and passes.
#
# Expected secret values:
#   GGSQL_TEST_URI_SNOWFLAKE   snowflake://user:pass@account/db/schema?warehouse=WH&role=R
#   GGSQL_TEST_URI_BIGQUERY    bigquery://<project-id>/<dataset>
#                              ?bigquery.auth_type=json_credential_file
#                              &bigquery.auth.credentials=/tmp/bq-ci-key.json
#                              &stmt.bigquery.query.default_dataset_id=<dataset>
#                              The default_dataset_id statement option is
#                              required: the driver never translates the
#                              connection's dataset into job defaultDataset.
#                              Validated against the BigQuery sandbox (free,
#                              billing-less tier); the harness populates via
#                              register() load jobs because the sandbox
#                              rejects DML.
#   GGSQL_BIGQUERY_KEY_JSON    service-account key JSON for the URI above;
#                              written to /tmp/bq-ci-key.json by a step below
#   GGSQL_TEST_URI_DATABRICKS  databricks://token:dapi...@host/sql/1.0/warehouses/<id>?catalog=x&schema=y
#
# The secrets must be configured under Settings → Secrets and variables →
# Actions before the legs do anything but skip.

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch:

jobs:
  # Build the dialect_live test binary once (reusable workflow shared with
  # dialect-live.yml), so the per-backend legs download it instead of each
  # recompiling the same crate against the same feature set. save-cache
  # stays false: a nightly run must not fight over the shared cache key
  # owned by build.yaml/main.
  compile:
    uses: ./.github/workflows/dialect-live-compile.yml

  live:
    needs: compile
    runs-on: ubuntu-latest
    strategy:
      # One backend's failure must not cancel the other legs.
      fail-fast: false
      matrix:
        include:
          - { backend: snowflake, driver: snowflake }
          - { backend: bigquery, driver: bigquery }
          - { backend: databricks, driver: databricks }

    env:
      GGSQL_TEST_URI_SNOWFLAKE: ${{ secrets.GGSQL_TEST_URI_SNOWFLAKE }}
      GGSQL_TEST_URI_BIGQUERY: ${{ secrets.GGSQL_TEST_URI_BIGQUERY }}
      GGSQL_TEST_URI_DATABRICKS: ${{ secrets.GGSQL_TEST_URI_DATABRICKS }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download the test binary
        uses: actions/download-artifact@v4
        with:
          name: dialect-live-bin

      - name: Make the test binary executable
        run: chmod +x dialect-live-bin

      - name: Install dbc and the ${{ matrix.backend }} ADBC driver
        run: |
          curl -LsSf https://dbc.columnar.tech/install.sh | sh
          # dbc install takes exactly one DRIVER per invocation.
          "$HOME/.local/bin/dbc" install ${{ matrix.driver }}

      - name: Check credentials
        # Fail when the leg's secret is missing on a non-fork repository
        # (the nightly on origin must not pass silently); forks only get a
        # warning and the test below skips.
        run: |
          var="GGSQL_TEST_URI_$(echo '${{ matrix.backend }}' | tr '[:lower:]' '[:upper:]')"
          if [ -z "${!var:-}" ]; then
            if [ "${{ github.event.repository.fork }}" = "false" ]; then
              echo "::error title=Missing secret::$var secret is not configured"
              exit 1
            fi
            echo "::warning title=Skipping ${{ matrix.backend }}::$var secret is not configured"
          fi

      - name: Write BigQuery service-account key
        if: matrix.backend == 'bigquery' && env.GGSQL_TEST_URI_BIGQUERY != ''
        env:
          GGSQL_BIGQUERY_KEY_JSON: ${{ secrets.GGSQL_BIGQUERY_KEY_JSON }}
        # Path must match bigquery.auth.credentials in the URI secret.
        run: printf '%s' "$GGSQL_BIGQUERY_KEY_JSON" > /tmp/bq-ci-key.json

      - name: Start the Databricks SQL warehouse and wait until RUNNING
        # A stopped warehouse makes the ADBC driver's open-session call fail
        # with 400 "Cannot create the resource, please try again later" —
        # the driver does not wait for startup, so ensure RUNNING first.
        # Token, host, and warehouse id are parsed out of the URI secret
        # (databricks://token:<pat>@<host>/sql/1.0/warehouses/<id>?...).
        if: matrix.backend == 'databricks' && env.GGSQL_TEST_URI_DATABRICKS != ''
        run: |
          uri="$GGSQL_TEST_URI_DATABRICKS"
          token=$(printf '%s' "$uri" | sed -E 's|^databricks://token:([^@]+)@.*|\1|')
          host=$(printf '%s' "$uri" | sed -E 's|^databricks://[^@]+@([^/]+)/.*|\1|')
          wh=$(printf '%s' "$uri" | sed -E 's|.*/warehouses/([^/?]+).*|\1|')
          api() { curl -sf -H "Authorization: Bearer $token" "$@"; }
          # Surface a failed start (e.g. 403 when the token's principal has
          # Can Use but not Can Manage on the warehouse) instead of polling
          # a warehouse that will never leave STOPPED.
          if ! start_resp=$(api -X POST "https://$host/api/2.0/sql/warehouses/$wh/start" 2>&1); then
            echo "::error title=Warehouse start failed::start POST failed: $start_resp"
            echo "The CI token's principal likely lacks Can Manage on warehouse $wh."
            exit 1
          fi
          state=""
          for i in $(seq 1 60); do
            state=$(api "https://$host/api/2.0/sql/warehouses/$wh" | jq -r .state)
            echo "warehouse $wh state: $state"
            case "$state" in
              RUNNING) break ;;
              DELETED|DELETING)
                echo "::error::warehouse $wh is $state — the ID in GGSQL_TEST_URI_DATABRICKS is stale"
                exit 1 ;;
            esac
            sleep 10
          done
          [ "$state" = "RUNNING" ]

      - name: Run the ${{ matrix.backend }} live test
        # The binary comes prebuilt from the compile job; invoked directly
        # as a libtest executable (no cargo, no `--` separator).
        # GGSQL_TEST_REQUIRE=1: with the credential check above failing on
        # missing secrets, the URI is always present here, so require it.
        env:
          GGSQL_TEST_REQUIRE: "1"
        run: ./dialect-live-bin live_${{ matrix.backend }} --exact --nocapture
